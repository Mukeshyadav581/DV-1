apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend-deployment
  namespace: wanderlust
  labels:
    app: frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      name: frontend
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          image: mukesh581/wanderlust-frontend-beta:v0.3
          ports:
            - containerPort: 5173
          env:
            - name: VITE_API_PATH
              value: "http://ac0dc3b9b101949b38050d2699c556eb-1703343785.ap-south-1.elb.amazonaws.com:8080"
---
apiVersion: v1
kind: Service
metadata:
  name: frontend-service
  namespace: wanderlust
spec:
  type: LoadBalancer
  selector:
    app: frontend
  ports:
    - port: 5173
      targetPort: 5173
      protocol: TCP
      # nodePort: 31000
