name: Wanderlust CI Pipeline

on:
  workflow_dispatch:
    inputs:
      frontend_docker_tag:
        description: 'Frontend Docker image tag'
        required: true
        type: string
      backend_docker_tag:
        description: 'Backend Docker image tag'
        required: true
        type: string

env:
  DOCKERHUB_USERNAME: mukesh581
  FRONTEND_IMAGE: wanderlust-frontend-beta
  BACKEND_IMAGE: wanderlust-backend-beta

